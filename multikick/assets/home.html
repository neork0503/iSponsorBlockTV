<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<style>
:root{--bg:#0b0e0f;--card:#141a1c;--card2:#1d2528;--g:#53fc18;--t:#f2f4f5;--m:#8b979c;--nav:60px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--t);font:14px/1.35 -apple-system,Roboto,"Segoe UI",sans-serif;overflow-x:clip}
body{padding-bottom:calc(var(--nav) + 8px)}
button{font:inherit;color:inherit}
/* pas d'en-tête sur les onglets : toute la hauteur sert au contenu. Barre fine seulement sur les sous-écrans. */
header{position:sticky;top:0;z-index:5;background:var(--bg);display:none;align-items:center;gap:6px;padding:4px 8px;border-bottom:1px solid #1b2326;min-height:48px}
.htitle{font-size:17px;font-weight:800;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:21px;border:0;background:transparent;color:var(--t);display:flex;align-items:center;justify-content:center;flex:none}
.ib:active{background:var(--card2)}
.ib svg{width:24px;height:24px;fill:currentColor}
.meini{width:64px;height:64px;border-radius:32px;background:var(--g);color:#000;font-weight:800;font-size:28px;display:flex;align-items:center;justify-content:center;flex:none}
nav{position:fixed;left:0;right:0;bottom:0;height:var(--nav);background:#0f1314;border-top:1px solid #1b2326;display:flex;z-index:20}
nav button{flex:1;border:0;background:transparent;color:var(--m);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;position:relative}
nav button svg{width:24px;height:24px;fill:currentColor}
nav button.on{color:var(--t)}
nav button.on svg{fill:var(--g)}
nav .badge2{position:absolute;top:5px;left:calc(50% + 6px);background:var(--g);color:#000;border-radius:9px;font-size:10px;font-weight:800;padding:0 5px;line-height:16px}
.top{height:10px}
h2{font-size:18px;margin:18px 12px 10px;display:flex;align-items:center;justify-content:space-between}
h2 small,h2 a{color:var(--m);font-weight:600;font-size:13px;text-decoration:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 12px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar,.row-s::-webkit-scrollbar,.ppl::-webkit-scrollbar,.acts::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 16px;border-radius:18px;background:var(--card);color:var(--t);font-weight:600;font-size:13px;border:0}
.chip.on{background:var(--g);color:#000}
.row-s{display:flex;gap:10px;overflow-x:auto;padding:0 12px;scrollbar-width:none}
.cat{flex:none;width:118px;border:0;background:transparent;padding:0;text-align:left}
.cat img{width:118px;height:157px;object-fit:cover;border-radius:10px;background:var(--card);display:block}
.cat b{display:block;margin-top:6px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat span{color:var(--m);font-size:12px}
.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px;padding:0 12px}
@media(min-width:600px){.cgrid{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media(min-width:900px){.cgrid{grid-template-columns:repeat(8,minmax(0,1fr))}}
.cgrid .cat{width:auto}.cgrid .cat img{width:100%;height:auto;aspect-ratio:3/4}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:18px 12px;padding:0 12px}
@media(min-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1200px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{position:relative;background:transparent;border:0;padding:0;text-align:left;display:block;width:100%;min-width:0}
.th{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--card)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.72);border-radius:8px;padding:3px 8px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
.badge i{width:8px;height:8px;border-radius:4px;background:var(--g);display:inline-block}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.75);border-radius:6px;padding:2px 6px;font-size:12px;font-weight:700}
.add{position:absolute;right:8px;bottom:8px;height:36px;padding:0 13px;border-radius:18px;background:rgba(0,0,0,.72);color:#fff;font:700 13px/36px sans-serif}
.add b{color:var(--g)}
.card.in .add{background:var(--g);color:#000}.card.in .add b{color:#000}
.creator-avatar{border:0;background:transparent;padding:0;flex:none;cursor:pointer}.creator-name{border:0;background:transparent;padding:0;text-align:left;font-weight:700;font-size:14px;color:var(--t)}
.row{display:flex;gap:10px;margin-top:9px;align-items:flex-start}
.av{width:40px;height:40px;border-radius:20px;object-fit:cover;background:var(--card2);flex:none}
.tx{min-width:0;flex:1}
.tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.tx .tt{color:#cfd6d9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .ct{color:var(--m);font-size:12px}
.ppl{display:flex;gap:14px;overflow-x:auto;padding:0 12px;scrollbar-width:none}
.pp{flex:none;width:70px;text-align:center;border:0;background:transparent;padding:0}
.pp img{width:62px;height:62px;border-radius:31px;object-fit:cover;display:block;margin:0 auto;background:var(--card2)}
.pp.live img{border:3px solid var(--g)}
.pp span{display:block;margin-top:5px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp i{display:block;font-style:normal;color:var(--g);font-size:11px;font-weight:700}
.list button.li{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;background:transparent;text-align:left}
.list button.li:active{background:var(--card)}
@media(min-width:900px){.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}}
.li .sub{color:var(--m);font-size:12px}
.li .lv{color:var(--g);font-weight:700;font-size:12px}
.more{display:block;margin:18px auto;padding:12px 28px;border-radius:22px;border:0;background:var(--card2);font-weight:700}
.msg{color:var(--m);text-align:center;padding:30px 20px}
.btn{border:0;border-radius:22px;padding:11px 20px;font-weight:800;background:var(--g);color:#000}
.btn2{border:0;border-radius:22px;padding:11px 18px;font-weight:700;background:var(--card2);color:var(--t)}
.srch{padding:12px 12px 0}
.srch input{width:100%;height:46px;border-radius:23px;border:1px solid #27333a;background:var(--card);color:var(--t);padding:0 18px;font-size:15px;outline:none}
.srch input:focus{border-color:var(--g)}
.banner{position:relative;height:150px;overflow:hidden}
.banner img{width:100%;height:100%;object-fit:cover;filter:brightness(.45)}
.banner div{position:absolute;left:12px;bottom:12px}
.banner b{font-size:24px;display:block}
.prof{display:flex;align-items:center;gap:14px;padding:14px 12px}
.prof img{width:64px;height:64px;border-radius:32px;object-fit:cover}
.menu button{display:flex;align-items:center;gap:14px;width:100%;padding:15px 16px;border:0;background:transparent;text-align:left;font-size:15px;border-bottom:1px solid #161d1f}
.menu svg{width:22px;height:22px;fill:var(--m)}
@media(min-width:900px){.menu,#pa{max-width:620px}}
/* écran d'une chaîne */
.pl{width:100%;aspect-ratio:16/9;background:#000;position:sticky;top:0;z-index:6}
.pl iframe{width:100%;height:100%;border:0;display:block}
.pl .off{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--m);background:#000 center/cover no-repeat}
.pl .off b{color:#fff;font-size:17px}
.pl .back{position:absolute;left:6px;top:6px;z-index:3;background:rgba(0,0,0,.55)}
body.fs{padding:0}
body.fs nav,body.fs header,body.fs .after,body.fs .chside,body.fs .pl .back{display:none}
body.fs .pl{position:fixed;inset:0;aspect-ratio:auto;height:100vh;z-index:50}
.info{display:flex;gap:10px;padding:10px 12px;align-items:center}
.info .av{width:46px;height:46px;border-radius:23px}
.info b{font-size:16px}
.info .tt{color:#cfd6d9;font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.info .ct{color:var(--g);font-size:12px;font-weight:700}
.acts{display:flex;gap:8px;overflow-x:auto;padding:4px 12px 10px;scrollbar-width:none}
.acts button{flex:none;border:0;border-radius:18px;padding:9px 14px;background:var(--card2);font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
.acts button.pri{background:var(--g);color:#000}
.acts svg{width:18px;height:18px;fill:currentColor}
.tabs{display:flex;border-bottom:1px solid #1b2326;position:sticky;top:56.25vw;z-index:5;background:var(--bg)}
.tabs button{flex:1;border:0;background:transparent;padding:12px 0;font-weight:700;color:var(--m);border-bottom:2px solid transparent}
.tabs button.on{color:var(--t);border-bottom-color:var(--g)}
.chatbox{height:calc(100vh - 56.25vw - var(--nav) - 46px);min-height:260px}
.chatbox iframe,.chside iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}
/* tablette / grand écran en paysage : lecteur et infos à gauche, chat toujours visible à droite */
.chview{display:flex;height:100vh}
.chmain{flex:1;min-width:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(var(--nav) + 30px)}
/* le live prend toute la hauteur de l'écran ; les infos, rediffs et clips apparaissent en faisant défiler vers le bas */
.chmain .pl{position:relative;aspect-ratio:auto;width:100%;height:100vh;max-height:none;margin:0}
.chmain .tabs{position:static}
.chside{width:var(--cw,min(400px,34vw));flex:none;border-left:1px solid #1b2326;height:100vh;position:relative;overflow:hidden;padding-bottom:0}
.chside iframe{transform-origin:0 0}
.chside.off{display:none}
/* poignée : on la glisse pour régler la largeur du chat */
.chsplit{flex:none;width:44px;margin:0 -22px;z-index:8;cursor:col-resize;touch-action:none;display:flex;align-items:center;justify-content:center}
.chsplit i{width:7px;height:96px;border-radius:4px;background:rgba(255,255,255,.4)}
.chsplit:active i,body.drag .chsplit i{background:var(--g)}
.chsplit.off{display:none}
body.drag iframe{pointer-events:none}
.chtools{display:none}   /* boutons retirés : on règle la largeur avec la poignée, double appui dessus = masquer le chat */
.chtools button{border:0;border-radius:14px;background:rgba(24,34,38,.92);color:#fff;font-weight:700;font-size:12px;padding:7px 11px;border:1px solid var(--line,#1b2326)}
.chshow{display:none;position:fixed;right:0;top:46%;z-index:9;border:0;border-radius:14px 0 0 14px;background:rgba(24,34,38,.92);color:#fff;font-weight:700;padding:12px 10px}
.chview.hide .chshow{display:block}
/* barre du bas : masquée pendant qu'on regarde un live (bouton pour la rappeler) */
body.cv nav{bottom:-140px;transition:bottom .28s ease}
body.cv.navon nav{bottom:calc(10px + env(safe-area-inset-bottom,0px))}
#navtab{display:none;position:fixed;left:50%;bottom:6px;transform:translateX(-50%);z-index:21;width:54px;height:20px;border:0;border-radius:10px;background:rgba(24,34,38,.85);color:#fff;font-size:12px;line-height:20px;padding:0}
body.cv:not(.navon) #navtab{display:block}
body.wide{padding-bottom:var(--nav)}
.seg{display:flex;gap:6px;margin:10px 12px 2px;padding:4px;border-radius:18px;background:var(--card);border:1px solid var(--line,#1b2326)}
.seg button{flex:1;border:0;background:transparent;color:var(--m);font-weight:700;font-size:14px;padding:10px 0;border-radius:14px;transition:background .2s,color .2s}
.seg button.on{background:rgba(83,252,24,.15);color:var(--t)}
#xb{padding-top:8px}
#xf .chips{padding:8px 12px 0}
#xf .chip{padding:7px 14px;font-size:13px}
.xbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 14px 10px}
.xbar span{color:var(--m);font-size:13px}
.xbar .btn2{padding:8px 14px;font-size:13px}
/* téléphone en paysage : le lecteur ne prend pas tout l'écran, on voit aussi les infos et le chat en dessous */
@media(orientation:landscape) and (max-width:899px){.pl{aspect-ratio:auto;height:100vh;position:relative}.tabs{top:0}.chatbox{height:80vh;min-height:200px}}
.blk{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:17px;background:rgba(6,9,10,.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line,#1b2326);display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff}
#bko{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.bks{width:100%;max-width:520px;background:#12191c;border-radius:26px 26px 0 0;padding:20px 18px 26px;display:flex;flex-direction:column;gap:12px}
.bks b{font-size:19px}.bks div{color:var(--m);font-size:13px;line-height:1.4}
.dly{margin:6px 12px 10px;padding:14px;border-radius:18px;background:linear-gradient(160deg,#1a2a12,var(--card));border:1px solid var(--line)}
.dly .sub{color:var(--m);font-size:12.5px;margin:6px 0 8px;line-height:1.35}
.dly .bar{height:8px;border-radius:4px;background:#232d30;overflow:hidden}
.dly .bar i{display:block;height:100%;background:linear-gradient(90deg,#6bff2e,#3fd60f)}
.dly .btn,.dly .btn2{width:100%;margin-top:4px}
.lt{position:absolute;left:8px;bottom:8px;padding:3px 8px;border-radius:10px;background:rgba(6,9,10,.7);color:#fff;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.feat{display:flex;gap:12px;overflow-x:auto;padding:0 12px 4px;scrollbar-width:none}
.feat::-webkit-scrollbar{display:none}
.feat .card{flex:none;width:260px}
.emo{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:10px;padding:0 0 8px}
.emo div{text-align:center;font-size:10px;color:var(--m);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.emo img{display:block;width:40px;height:40px;margin:0 auto 3px;object-fit:contain}
.emo .sub img{opacity:.45}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:2px 12px 4px}
.quick button{border:1px solid var(--line,#1b2326);border-radius:18px;background:linear-gradient(160deg,#16241a,var(--card));padding:14px;text-align:left;display:flex;flex-direction:column;gap:3px;transition:transform .15s}
.quick button:active{transform:scale(.97)}
.quick b{font-size:15px}.quick span{color:var(--m);font-size:11.5px;line-height:1.3}
/* téléphone en portrait : hauteur du lecteur réglable au doigt (poignée sous le lecteur) */
@media(orientation:portrait){
#view>.pl{aspect-ratio:auto;height:var(--ph,56.25vw)}
#view .tabs{top:var(--ph,56.25vw)}
#view .chatbox{height:calc(100vh - var(--ph,56.25vw) - 56px);min-height:200px}
}
/* image dans l'image : seul le lecteur reste, plein cadre */
body.pip nav,body.pip header,body.pip .after,body.pip .chside,body.pip .chsplit,body.pip .vsplit,body.pip .back,body.pip #navtab,body.pip .chshow{display:none!important}
body.pip .pl,body.pip #view>.pl,body.pip .chmain .pl{position:fixed!important;inset:0;width:100vw!important;height:100vh!important;max-height:none!important;z-index:100}
body.pip .chmain{overflow:hidden}
.vsplit{position:absolute;left:0;right:0;bottom:0;height:34px;z-index:7;display:flex;align-items:flex-end;justify-content:center;touch-action:none;background:linear-gradient(transparent,rgba(0,0,0,.45))}
.vsplit i{width:56px;height:6px;border-radius:3px;background:rgba(255,255,255,.55);margin-bottom:7px}
body.drag .vsplit i{background:var(--g)}
.chview .vsplit{display:none}
@media(orientation:landscape){.vsplit{display:none}}
/* ---------- habillage 2026 : verre dépoli, coins larges, animations douces ---------- */
:root{--bg:#06090a;--card:#10171a;--card2:#182226;--nav:64px;--line:rgba(255,255,255,.07);--glow:0 0 24px rgba(83,252,24,.28)}
html{color-scheme:dark}
body{background:radial-gradient(120% 60% at 50% -10%,#0e1f12 0%,var(--bg) 55%);background-attachment:fixed;letter-spacing:.005em;padding-bottom:calc(var(--nav) + 30px);-webkit-font-smoothing:antialiased}
nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));height:var(--nav);border-radius:26px;border:1px solid var(--line);background:rgba(16,22,25,.78);-webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4);box-shadow:0 10px 30px rgba(0,0,0,.55);padding:6px;gap:4px}
@media(min-width:700px){nav{left:50%;right:auto;width:560px;transform:translateX(-50%)}}
nav button{border-radius:20px;transition:background .25s,color .25s,transform .15s}
nav button:active{transform:scale(.94)}
nav button.on{background:rgba(83,252,24,.13)}
nav button.on svg{filter:drop-shadow(0 0 6px rgba(83,252,24,.55))}
#view>*{animation:up .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{font-size:19px;font-weight:800;letter-spacing:-.01em}
.chip{border:1px solid var(--line);transition:background .2s,transform .15s}
.chip:active{transform:scale(.95)}
.chip.on{background:linear-gradient(135deg,#6bff2e,#3fd60f);box-shadow:var(--glow);border-color:transparent}
.th{border-radius:18px;box-shadow:0 6px 18px rgba(0,0,0,.45);border:1px solid var(--line)}
.th img,.cat img,.av,.pp img{animation:fade .5s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.th,.cat img,.av,.pp img{background:var(--card2)}
.cat img{border-radius:16px;border:1px solid var(--line)}
.card,.cat,.pp,.list button.li{transition:transform .15s}
.card:active,.cat:active,.pp:active{transform:scale(.975)}
.badge{background:rgba(6,9,10,.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line)}
.badge i{box-shadow:0 0 0 0 rgba(83,252,24,.7);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(83,252,24,0)}100%{box-shadow:0 0 0 0 rgba(83,252,24,0)}}
.add{background:rgba(6,9,10,.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);transition:background .2s}
.card.in .add{background:linear-gradient(135deg,#6bff2e,#3fd60f);box-shadow:var(--glow)}
.btn{background:linear-gradient(135deg,#6bff2e,#3fd60f);box-shadow:var(--glow);transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn2{border:1px solid var(--line)}
.srch input{border-radius:26px;height:50px;background:var(--card);border-color:var(--line)}
.menu button{border-bottom:1px solid var(--line);transition:background .2s}
.menu button:active{background:var(--card)}
.meini{box-shadow:var(--glow)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Live pages use the whole viewport; hidden navigation reserves no space. */
body.cv{padding-bottom:0!important}
body.cv #view>*{animation:none;transform:none}
body.cv nav{display:none}
body.wide.cv{height:100vh;height:100dvh;overflow:hidden}
body.wide.cv .chview{height:100vh;height:100dvh;min-height:0}
body.wide.cv .chmain{padding-bottom:0;min-height:0}
body.wide.cv .chmain .pl{height:100vh;height:100dvh}
body.wide.cv .chside{height:100%}
/* Override the inline-player height rule when native fullscreen is selected. */
body.fs #view .pl{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;aspect-ratio:auto;max-height:none}

/* Le lecteur reste attaché au document : la navigation ne recharge pas sa vidéo. */
#mini-channel{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom) + 12px);width:min(44vw,320px);height:auto;aspect-ratio:16/9;z-index:40;background:#000;border-radius:10px;overflow:hidden;box-shadow:0 3px 18px #0009}
#mini-channel .pl,#mini-channel .chview,#mini-channel .chmain{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;min-height:0!important;max-height:none!important;margin:0!important;display:block!important;aspect-ratio:auto!important;overflow:hidden!important}
#mini-channel .after,#mini-channel .chside,#mini-channel .chsplit,#mini-channel .chshow,#mini-channel .vsplit{display:none!important}
#mini-channel[data-positioned]{left:var(--mini-x);top:var(--mini-y);right:auto;bottom:auto}
.mini-drag{position:absolute;inset:0;z-index:105;touch-action:none;cursor:grab}
.mini-drag:active{cursor:grabbing}
.mini-drag:focus-visible{outline:2px solid var(--g);outline-offset:-2px}
.mini-tools{display:none;position:absolute;bottom:0;left:0;right:0;z-index:111;background:#000b;gap:2px}
.mini-tools.on{display:flex}.mini-tools button{flex:1;min-width:0;min-height:38px;border:0;background:transparent;color:#fff;font-size:11px;padding:3px}
body.pip .mini-tools{display:none!important}
body.pip .mini-drag{display:none!important}
.mini-actions{position:absolute;top:3px;right:3px;display:flex;gap:4px;z-index:110}
.mini-actions button{width:36px;height:36px;border:0;border-radius:18px;background:#000b;color:#fff;font-size:20px}
body.pip #mini-channel{left:0!important;top:0!important;right:0!important;bottom:0!important;width:100vw;height:100dvh;border-radius:0;box-shadow:none}
body.pip:has(#mini-channel) #view,body.pip .mini-actions{display:none!important}

/* ---------- mobile & tablette : mise en page nette, sans éléments qui se chevauchent ---------- */
:root{--nav:60px;--sab:env(safe-area-inset-bottom,0px);--rail:76px}
/* barre du bas ancrée (plus flottante) : le contenu s'arrête au-dessus, rien ne passe dessous */
body{padding-bottom:calc(var(--nav) + var(--sab) + 16px)}
nav{left:0;right:0;bottom:0;width:auto;transform:none;height:calc(var(--nav) + var(--sab));padding:4px 8px var(--sab);gap:2px;border-radius:0;border:0;border-top:1px solid var(--line);background:#0a0f11;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none}
nav button{border-radius:14px}
nav .badge2{top:3px}
/* paysage (téléphone ou tablette) : rail vertical à gauche, toute la hauteur reste pour le contenu */
@media(orientation:landscape){
  body{padding-bottom:16px;padding-left:calc(var(--rail) + env(safe-area-inset-left,0px))}
  body.cv{padding-left:0!important}
  nav{top:0;right:auto;bottom:0;width:calc(var(--rail) + env(safe-area-inset-left,0px));height:auto;flex-direction:column;justify-content:center;gap:6px;padding:8px 6px 8px calc(6px + env(safe-area-inset-left,0px));border-top:0;border-right:1px solid var(--line)}
  nav button{flex:none;height:58px}
  nav .badge2{left:calc(50% + 4px)}
}
/* vignettes : compteur + durée groupés en haut à gauche, « + Multi » seul en bas à droite, bouton bloquer en haut à droite */
.tl{position:absolute;left:8px;top:8px;right:52px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:none}
.tl .badge,.tl .lt{position:static}
.tl .lt{padding:4px 8px;border:1px solid var(--line)}
.blk{width:36px;height:36px;border-radius:18px}
.add{max-width:calc(100% - 16px)}
.badge,.lt,.dur{max-width:calc(100% - 60px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .tt{font-size:13px}
/* titres de section : bouton d'action discret, pas un gros bouton qui pousse le titre */
h2{gap:12px}
h2 .btn2,h2 button{font-size:13px;padding:7px 14px;flex:none}
h2>span,h2>:first-child:not(a):not(button){min-width:0}
#hfavs .msg{padding-inline:12px!important}
.chips{padding-top:8px}
/* mini-lecteur : posé au-dessus de la barre de navigation, jamais par-dessus */
#mini-channel{bottom:calc(var(--nav) + var(--sab) + 12px);width:min(46vw,320px)}
@media(orientation:landscape){#mini-channel{bottom:calc(var(--sab) + 12px);width:min(34vw,300px)}}
#mini-channel[data-positioned]{bottom:auto}
.mini-tools button{min-height:44px}
.mini-actions button{width:40px;height:40px}
/* fenêtres du bas : au-dessus de la barre et du rail */
#bko{z-index:80}
.bks{padding-bottom:calc(26px + var(--sab))}
/* tablette portrait : contenu centré, listes plus aérées */
@media(min-width:700px) and (orientation:portrait){
  #view>.grid,#view>.cgrid,#view>.quick,#view>.chips,#view>.row-s,#view>.srch{max-width:1000px;margin-inline:auto}
  .grid{gap:22px 16px;padding:0 16px}
  .quick{grid-template-columns:repeat(4,1fr);padding:2px 16px 4px}
}
/* tablette paysage : grille à 3 colonnes (le rail occupe déjà de la largeur) */
@media(min-width:900px) and (orientation:landscape){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.quick{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1300px) and (orientation:landscape){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
/* téléphone en paysage : cartes sur 2 colonnes au lieu d'une énorme vignette */
@media(orientation:landscape) and (max-width:899px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.cgrid{grid-template-columns:repeat(4,minmax(0,1fr))}.quick{grid-template-columns:repeat(4,1fr)}}

  // ---------- liste de lives : API du site Kick (web.kick.com), qui filtre la langue et la catégorie CÔTÉ SERVEUR

  /**
   * Charge les lives dans une grille, par pages, avec filtre de langue / catégorie et tri.

   * - tri croissant sans langue : ancienne API (tri natif sur la liste mondiale).
   * - tri croissant avec langue : on charge toute la langue (≤ 2000 lives) puis on inverse.

  function liveFeed(o, grid, msg, more) {
    var after = '', page = 0, seen = {}, busy = false, done = false, got = 0, shown = [], buf = null;
    function alive() { return o.my === undefined || o.my === xTok; }
    function add(list) {
      var a = list.filter(function (s) { var k = s.channel && s.channel.slug; if (!k || seen[k] || isBlocked(k)) return false; seen[k] = 1; return true; });
      got += a.length;
      a.forEach(function (s) { shown.push(s.channel.slug); });
      if (a.length) { grid.insertAdjacentHTML('beforeend', a.map(liveCard).join('')); bindCards(grid); }
    }
    function finish() {
      busy = false;
      more.style.display = done ? 'none' : 'block';
      msg.style.display = got ? 'none' : 'block';
      if (!got) msg.textContent = o.lang === 'all' || !o.lang ? 'Aucun live pour le moment.' : 'Aucun live dans cette langue pour le moment. Essaie « Toutes ».';
      if (o.onCount) o.onCount(got, done);
    }
    function fail(retry) { busy = false; if (alive()) { if (o.onCount) o.onCount(-1, false); netErr(msg, retry); } }
    function loadAscLang() {   // tout charger puis inverser
      if (buf) { add(buf.splice(0, 24)); done = !buf.length; return finish(); }
      var all = [], n = 0;
      (function step() {
        jfetchLives({lang: o.lang, cat: o.cat, limit: 100, after: after}).then(function (r) {

  // La fenêtre « Règles du chat » de Kick recouvre le chat : on la ferme (jamais « J'accepte » à ta place) ou on la masque.
  // Le chat est de même origine : on surveille l'iframe tant qu'elle existe, la fenêtre peut s'ouvrir à tout moment.
  // Voile gris translucide laissé par la fenêtre (plein écran, fixe, sans texte) : il assombrit le chat, on l'enlève
  function dimSweep(d) {
    var win = d.defaultView, vw = win.innerWidth, vh = win.innerHeight, found = false;
    Array.prototype.forEach.call(d.body.querySelectorAll(':scope > *, :scope > * > *'), function (e) {
      if (e.offsetWidth < vw * 0.9 || e.offsetHeight < vh * 0.9 || (e.textContent || '').trim().length > 3) return;
      var cs = win.getComputedStyle(e); if (cs.position !== 'fixed' || cs.display === 'none') return;
      var m = (cs.backgroundColor || '').match(/rgba\(([^)]+)\)/); if (!m) return;
      var p = m[1].split(','), a = p.length > 3 ? parseFloat(p[3]) : 1;
      if (a > 0 && a < 1) { e.style.setProperty('display', 'none', 'important'); found = true; }
    });
    if (found) {
      d.querySelectorAll('[inert]').forEach(function (e) { e.removeAttribute('inert'); });
      d.querySelectorAll('[aria-hidden=true]').forEach(function (e) { if (e.tagName !== 'svg') e.removeAttribute('aria-hidden'); });
      d.body.style.pointerEvents = 'auto'; d.body.removeAttribute('data-scroll-locked'); d.body.style.overflow = '';
    }
  }

    if (!f) return;

    function sweep() {
      if (busy) return;
      try {
        var d = f.contentDocument; if (!d || !d.body) return;
        if (f.id === 'chf' && !d.getElementById('mkdlg') && d.head) { var st = d.createElement('style'); st.id = 'mkdlg'; st.textContent = '#user-identity{right:8px!important;left:auto!important;width:calc(100% - 16px)!important;max-width:356px!important}'; d.head.appendChild(st); }
        dimSweep(d);
        var w = d.createTreeWalker(d.body, NodeFilter.SHOW_TEXT), node, hit = null;
        while ((node = w.nextNode())) { if (node.nodeValue.length < 40 && re.test(node.nodeValue)) { hit = node.parentNode; break; } }
        if (!hit) return;
        busy = true;
        var top = null, e = hit, win = d.defaultView;
        while (e && e !== d.body) { if (win.getComputedStyle(e).position === 'fixed') top = e; e = e.parentNode; }
        if (!top) top = hit.closest('[role=dialog]') || hit;
        var pick = null;
        Array.prototype.forEach.call(top.querySelectorAll('button'), function (b) {
          if (!pick && (/close|fermer/i.test(b.getAttribute('aria-label') || '') || /^[×xX✕]$/.test((b.textContent || '').trim()))) pick = b;
        });
        if (pick) pick.click();
        setTimeout(function () {
          try {
            if (top.isConnected && re.test(top.textContent || '')) top.style.setProperty('display', 'none', 'important');
            d.querySelectorAll('[data-radix-focus-guard]').forEach(function (g) { g.remove(); });
            d.body.style.pointerEvents = 'auto'; d.body.removeAttribute('data-scroll-locked'); d.body.style.overflow = '';
          } catch (x) {}
          busy = false;
        }, 350);
      } catch (x) { busy = false; }
    }
    var timer = setInterval(function () { if (!f.isConnected) { clearInterval(timer); return; } sweep(); }, 1200);
  }

      miniPosition={x:dx?Math.max(0,Math.min(1,(x-4)/dx)):0,y:dy?Math.max(0,Math.min(1,(y-4)/dy)):0};placeMini();
    }
    surface.onpointerdown=function(e){if(e.isPrimary===false||e.button!==0||document.body.classList.contains('pip'))return;e.preventDefault();var r=host.getBoundingClientRect();drag={id:e.pointerId,x:e.clientX-r.left,y:e.clientY-r.top,startX:e.clientX,startY:e.clientY,moved:false};surface.setPointerCapture(e.pointerId);};
    surface.onpointermove=function(e){if(!drag||drag.id!==e.pointerId)return;e.preventDefault();if(Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)>6)drag.moved=true;if(drag.moved)moveTo(e.clientX-drag.x,e.clientY-drag.y);};
    function end(e){if(!drag||drag.id!==e.pointerId)return;var tap=!drag.moved&&e.type==='pointerup';drag=null;jset('mk_mini_pos',miniPosition);if(tap){var tools=host.querySelector('.mini-tools');if(tools)tools.classList.toggle('on');}}
    surface.onpointerup=end;surface.onpointercancel=end;surface.onlostpointercapture=end;
    surface.onkeydown=function(e){var delta={ArrowLeft:[-16,0],ArrowRight:[16,0],ArrowUp:[0,-16],ArrowDown:[0,16]}[e.key];if(!delta)return;e.preventDefault();var r=host.getBoundingClientRect();moveTo(r.left+delta[0],r.top+delta[1]);jset('mk_mini_pos',miniPosition);};
    host.appendChild(surface);placeMini();
  }
  window.addEventListener('resize',placeMini);
  function miniState(){native('pipActive',!!miniChannel||!!V.querySelector('.pl iframe'));}
  function closeMini(){if(miniChannel){miniChannel.remove();miniChannel=null;}miniState();}
  function prepareMini(p,qs){
    var slug=p[0]==='c'&&p[1]?decodeURIComponent(p[1]):null;
    if(slug&&miniChannel){
      var pl=miniChannel.querySelector('.pl');
      if(pl.dataset.s===slug&&pl.dataset.m===(qs.get('m')||'')){
        V.remove();V=miniChannel;miniChannel=null;V.id='view';var actions=V.querySelector('.mini-actions');if(actions)actions.remove();var dragSurface=V.querySelector('.mini-drag');if(dragSurface)dragSurface.remove();var tools=V.querySelector('.mini-tools');if(tools)tools.remove();delete V.dataset.positioned;V.style.removeProperty('--mini-x');V.style.removeProperty('--mini-y');
      }else closeMini();
    }else if(!slug&&!miniChannel&&V.querySelector('.pl iframe')){
      miniChannel=V;miniChannel.id='mini-channel';
      var source=miniChannel.querySelector('.pl');
      var target='#/c/'+encodeURIComponent(source.dataset.s)+(source.dataset.m?'?m='+encodeURIComponent(source.dataset.m):'');
      var controls=document.createElement('div');controls.className='mini-actions';
      controls.innerHTML='<button aria-label="Revenir au live">↗</button><button aria-label="Fermer le mini-lecteur">×</button>';
      controls.children[0].onclick=function(){go(target);};controls.children[1].onclick=closeMini;
      miniChannel.appendChild(controls);makeMiniDraggable(miniChannel);
      var tools=document.createElement('div');tools.className='mini-tools';tools.innerHTML='<button data-action="fullscreen" aria-label="Plein écran">⛶ Écran</button><button data-action="multi">+ Multi</button><button data-action="choose">Choisir</button>';
      var host=miniChannel;tools.querySelectorAll('[data-action]').forEach(function(button){button.onclick=function(){playerAction(host,button.dataset.action);};});host.appendChild(tools);
      V=document.createElement('main');V.id='view';miniChannel.insertAdjacentElement('afterend',V);
    }
    miniState();
  }
  function playerAction(host,action){
    if(!host||!host.isConnected)return;var pl=host.querySelector('.pl');if(!pl)return;
    var slug=pl.dataset.s,media=pl.dataset.m;
    if(action==='multi'){native('add',slug);native('openMulti');}
    else if(action==='choose')go('#/browse');
    else if(action==='profile')go('#/creator/'+encodeURIComponent(slug));
    else if(action==='fullscreen'){
      var fs=host!==miniChannel&&document.body.classList.contains('fs');
      go('#/c/'+encodeURIComponent(slug)+(fs?'':'/fs')+(media?'?m='+encodeURIComponent(media):''));
    }
  }
  function scrollInfo(dir){var m=V.querySelector('.chmain'),o={top:dir*innerHeight*.85,behavior:'smooth'};if(m&&m.scrollHeight>m.clientHeight)m.scrollBy(o);else window.scrollBy(o);}
  window.addEventListener('message',function(e){
    if(e.origin!==location.origin||!e.data)return;
    if(e.data.type==='mk-scroll'){scrollInfo(e.data.dir>0?1:-1);return;}
    if(e.data.type==='mk-player-action'&&e.data.action==='info'){scrollInfo(1);return;}
    if(e.data.type!=='mk-player-action')return;
    var hosts=[V,miniChannel];for(var i=0;i<hosts.length;i++){var host=hosts[i],frame=host&&host.querySelector('.pl iframe');if(frame&&e.source===frame.contentWindow){playerAction(host,e.data.action);return;}}
  });
  function viewCreator(slug){
    hdrBack('Profil Kick');V.innerHTML='<div id="creator"><div class="msg">Chargement du profil…</div></div>';var target=$('creator');
    jfetch('/api/v2/channels/'+encodeURIComponent(slug)).then(function(j){
      if(!target.isConnected)return;var user=j.user;if(!user||!user.username)throw new Error('Profil indisponible');
      var image=user.profile_pic||user.profilepic||'',followers=j.followers_count;
      var count=typeof followers==='number'&&Number.isFinite(followers)&&followers>=0?fmt(followers):'—';
      target.innerHTML='<div class="prof"><img src="'+esc(image)+'"><div class="tx"><b style="font-size:22px">'+esc(user.username)+'</b><div class="ct">'+count+' abonnés Kick</div><div class="ct">'+(j.livestream?'● En direct':'Hors ligne')+'</div></div></div><div style="padding:0 12px 14px;white-space:pre-wrap;color:#cfd6d9" id="creator-bio">'+esc(user.bio||'Aucune description disponible.')+'</div><div class="acts"><button class="pri" id="creator-watch">Regarder le live</button><button id="creator-add">+ MultiKick</button><button id="creator-fav">☆ Favori</button><button id="creator-official">Ouvrir sur Kick</button></div>';
      $('creator-watch').onclick=function(){go('#/c/'+encodeURIComponent(slug));};$('creator-add').onclick=function(){native('add',slug);this.textContent='✓ Dans le multi';};
      var fav=$('creator-fav');function paintFav(){fav.textContent=native('isFav',slug)===true?'★ Favori':'☆ Favori';}paintFav();fav.onclick=function(){native('toggleFav',slug);setTimeout(paintFav,150);};
      $('creator-official').onclick=function(){native('openKick',slug);};
    }).catch(function(){if(!target.isConnected)return;target.innerHTML='<div class="msg">Profil indisponible. <button class="btn2" id="creator-retry">Réessayer</button></div>';$('creator-retry').onclick=function(){viewCreator(slug);};});
  }
  // ---------- navigation
  function route() {
    clearTimeout(followingTimer);routeVersion++;routeRequests.forEach(function(c){c.abort();});routeRequests.clear();
    loadBlocked();
    var h = location.hash || '#/';
    var q = h.indexOf('?'), qs = q >= 0 ? new URLSearchParams(h.slice(q + 1)) : new URLSearchParams();
    if (q >= 0) h = h.slice(0, q);
    var p = h.replace(/^#\/?/, '').split('/');
    prepareMini(p,qs);
    var tab = {'': 'home', lives: 'home', vods: 'home', clips: 'home', browse: 'browse', cat: 'browse', drops: 'home', following: 'following', creator:'home', profile: 'profile', favorites: 'profile', blocked: 'profile'}[p[0]] || '';
    Array.prototype.forEach.call($('nav').children, function (b) { b.classList.toggle('on', b.dataset.t === tab); });
    if (p[0] !== 'c') { document.body.classList.remove('fs'); document.body.classList.remove('wide'); native('orient', false); }
    document.body.classList.toggle('cv', p[0] === 'c');   // sur un live : barre du bas masquée
    document.body.classList.remove('navon');
    if (p[0] === 'c' && p[1]) return viewChannel(decodeURIComponent(p[1]), p[2] === 'fs', qs.get('m'));
    window.scrollTo(0, 0);
    if (p[0] === 'lives' || p[0] === 'vods' || p[0] === 'clips') return viewExplore(p[0]);
    if (p[0] === 'browse') return viewBrowse();
    if (p[0] === 'drops') return viewDrops();
    if (p[0] === 'cat' && p[1]) return viewCat(decodeURIComponent(p[1]));
    if (p[0] === 'creator' && p[1]) return viewCreator(decodeURIComponent(p[1]));
    if (p[0] === 'favorites') return viewFavorites();
    if (p[0] === 'following') return viewFollowing();
    if (p[0] === 'profile') return viewProfile();
    if (p[0] === 'blocked') return viewBlocked();
    viewHome();
  }
  Array.prototype.forEach.call($('nav').children, function (b) {
    b.onclick = function () {
      var t = b.dataset.t;
      if (t === 'multi') { native('openMulti'); return; }
      var target = t === 'home' ? '#/' : '#/' + t;
      if (location.hash === target || (t === 'home' && !location.hash)) { window.scrollTo({top: 0, behavior: 'smooth'}); route(); }
      else go(target);
    };
  });
  window.addEventListener('hashchange', route);
  window.addEventListener('popstate', function () {
    var o = $('lgo'); if (o) { o.remove(); native('loginCancel'); }
  });
  // rotation / redimensionnement : on refait la mise en page seulement si on passe de « téléphone » à « tablette en paysage »
  window.addEventListener('resize', function () {
    var w = isWide();
    if (w !== wideNow) { wideNow = w; route(); }
  });

  // appelé par l'app : lives déjà dans le multi
  window.home = {
    pip: function (on) { document.body.classList.toggle('pip', !!on);if(!on)placeMini(); },
    loginState: function (msg) {
      if ($('lgm')) { $('lgm').style.color = '#ff6b6b'; $('lgm').textContent = msg; }
      if ($('lgb')) { $('lgb').disabled = false; $('lgb').style.opacity = 1; }
    },
    loginDone: function () {
      var o = $('lgo'); if (o) { o.remove(); if (history.state && history.state.lg) history.back(); }
      meTried = false; me = null; route();
    },
    setOpen: function (arr) {
      var favoritesNow=JSON.stringify(favoriteIds());if(favoritesNow!==favoriteSnapshot && /^(?:#\/?|#\/favorites)?$/.test(location.hash)){favoriteSnapshot=favoritesNow;route();}
      open = {}; (arr || []).forEach(function (s) { open[s] = 1; });
      var n = (arr || []).length; $('mc').style.display = n ? 'block' : 'none'; $('mc').textContent = n;
      Array.prototype.forEach.call(document.querySelectorAll('.card[data-s]'), function (b) {
        var on = !!open[b.dataset.s]; b.classList.toggle('in', on);
        var a = b.querySelector('.add'); if (a) a.innerHTML = on ? '✓ Multi' : '<b>+</b> Multi';
      });
    }
  };
  route();
})();
</script>
